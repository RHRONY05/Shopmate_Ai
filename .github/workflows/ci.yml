name: ShopMate AI - Production CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Full-Stack Verification & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: shopmate_user
          POSTGRES_PASSWORD: shopmate_password
          POSTGRES_DB: shopmate_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # Backend Checks
      - name: Install Backend Dependencies
        run: npm ci --prefix backend

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate

      - name: Push Test Database Schema
        working-directory: backend
        run: npx prisma db push
        env:
          DATABASE_URL: postgresql://shopmate_user:shopmate_password@localhost:5432/shopmate_test_db?schema=public

      - name: Run Backend Vitest Test Suite (67 Tests)
        run: npm run test --prefix backend
        env:
          NODE_ENV: test
          PORT: 5001
          DATABASE_URL: postgresql://shopmate_user:shopmate_password@localhost:5432/shopmate_test_db?schema=public
          REDIS_URL: redis://localhost:6379
          LOG_LEVEL: silent
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'test_key' }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY || 'sk_test_mock' }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET || 'whsec_mock' }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY || 'test_clerk' }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY || 'pk_test_mock' }}

      - name: Build Backend TypeScript
        run: npm run build --prefix backend

      # Frontend Checks
      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps
          ROLLUP_VER=$(node -p "require('./node_modules/rollup/package.json').version")
          npm install --no-save @rollup/rollup-linux-x64-gnu@$ROLLUP_VER

      - name: Run Frontend Vitest Test Suite
        working-directory: frontend
        run: npm run test

      - name: Build Frontend Application
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:5000
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_mock
          VITE_STRIPE_PUBLISHABLE_KEY: pk_test_mock
