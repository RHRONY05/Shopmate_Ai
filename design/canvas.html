<!doctype html>
<html lang="en" data-chrome="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design Canvas</title>
<!-- Viewer chrome only. Its own colors are tooling, not product tokens — the token linter ignores this file. -->
<style>
  :root {
    --c-bg: #E9E6E1; --c-dot: #CFCAC2; --c-ink: #1D1C1A; --c-sub: #66625B; --c-panel: #FFFFFF;
    --c-line: #D6D1C9; --c-hover: #F2EFEA; --c-accent: #2B59C3; --c-frame-shadow: 0 1px 2px rgba(0,0,0,.06), 0 12px 32px rgba(0,0,0,.10);
    --s-draft: #8C6A12; --s-review: #2B59C3; --s-changes: #B4442F; --s-approved: #2C7A4B;
  }
  [data-chrome="dark"] {
    --c-bg: #18181A; --c-dot: #2B2B30; --c-ink: #ECE9E4; --c-sub: #A29E97; --c-panel: #232327;
    --c-line: #393940; --c-hover: #2C2C31; --c-accent: #8AA9FF; --c-frame-shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.45);
    --s-draft: #E0B44A; --s-review: #8AA9FF; --s-changes: #F08A76; --s-approved: #6CC793;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--c-bg); color: var(--c-ink);
    font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  button, select, a { font: inherit; color: inherit; }

  /* Toolbar */
  .bar { position: fixed; inset: 0 0 auto 0; height: 52px; z-index: 10; display: flex; align-items: center; gap: 8px;
    padding: 0 12px; background: var(--c-panel); border-bottom: 1px solid var(--c-line); }
  .bar h1 { font-size: 15px; margin: 0 8px 0 4px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 28vw; }
  .bar .spacer { flex: 1; }
  .tb { height: 34px; min-width: 34px; padding: 0 10px; border: 1px solid var(--c-line); border-radius: 8px; background: var(--c-panel);
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .tb:hover { background: var(--c-hover); }
  .tb:focus-visible, .frame-title:focus-visible, .fx:focus-visible { outline: 2px solid var(--c-accent); outline-offset: 2px; }
  select.tb { padding-right: 6px; }
  .zoom { min-width: 64px; font-variant-numeric: tabular-nums; }
  .counts { display: flex; gap: 10px; color: var(--c-sub); font-size: 12px; white-space: nowrap; }
  .counts b { color: var(--c-ink); font-variant-numeric: tabular-nums; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: 0; }

  /* Viewport */
  .viewport { position: fixed; inset: 52px 0 0 0; overflow: hidden; cursor: default;
    background-image: radial-gradient(var(--c-dot) 1px, transparent 1px); }
  .viewport.panning, .shield { cursor: grabbing; }
  .world { position: absolute; left: 0; top: 0; transform-origin: 0 0; padding: 160px; display: flex; flex-direction: column; gap: 220px; }
  .shield { position: absolute; inset: 0; z-index: 5; display: none; cursor: grab; }
  .shield.on { display: block; }

  .group-title { font-size: 56px; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 56px; white-space: nowrap; }
  .group-row { display: flex; gap: 96px; align-items: flex-start; }

  .frame { margin: 0; display: flex; flex-direction: column; gap: 12px; }
  .frame-head { display: flex; align-items: center; gap: 10px; min-height: 28px; }
  .frame-title { border: 0; background: none; padding: 0; cursor: zoom-in; font-size: 16px; font-weight: 700; text-align: left; }
  .frame-title:hover { color: var(--c-accent); }
  .frame-size { color: var(--c-sub); font-size: 13px; font-variant-numeric: tabular-nums; }
  .pill { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px;
    border: 1px solid currentColor; }
  .pill.draft { color: var(--s-draft); } .pill.review { color: var(--s-review); } .pill.changes { color: var(--s-changes); } .pill.approved { color: var(--s-approved); }
  .frame-open { margin-left: auto; color: var(--c-sub); font-size: 13px; text-decoration: none; }
  .frame-open:hover { color: var(--c-accent); }
  .frame-body { position: relative; overflow: hidden; background: #FFF; box-shadow: var(--c-frame-shadow); }
  .frame-body iframe { display: block; border: 0; width: 100%; height: 100%; background: #FFF; }
  .frame-note { color: var(--c-sub); font-size: 14px; line-height: 1.5; margin: 4px 0 0; }

  /* Focus mode */
  .focus { position: fixed; inset: 0; z-index: 20; display: none; flex-direction: column; background: var(--c-bg); }
  .focus.on { display: flex; }
  .focus-bar { display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 12px; background: var(--c-panel); border-bottom: 1px solid var(--c-line); }
  .focus-bar h2 { font-size: 15px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .focus-stage { flex: 1; display: grid; place-items: center; overflow: auto; padding: 24px; }
  .focus-wrap { transform-origin: 0 0; }
  .focus-note { max-width: 760px; margin: 0 auto; padding: 0 24px 16px; color: var(--c-sub); text-align: center; }
  .fx { border: 0; background: none; cursor: pointer; }

  .empty { position: fixed; inset: 52px 0 0 0; display: grid; place-items: center; text-align: center; color: var(--c-sub); padding: 24px; }
  .empty code { background: var(--c-panel); padding: 2px 6px; border-radius: 6px; }
  .help { color: var(--c-sub); font-size: 12px; white-space: nowrap; }
  @media (max-width: 900px) { .help, .counts { display: none; } }
</style>
<script src="canvas.js"></script>
</head>
<body>
  <header class="bar">
    <h1 id="title">Design Canvas</h1>
    <div class="counts" id="counts" aria-live="polite"></div>
    <div class="spacer"></div>
    <span class="help">Drag / Space+drag to pan · Ctrl+wheel zoom · F fit · 0 = 100%</span>
    <select id="group" class="tb" aria-label="Show group"></select>
    <select id="theme" class="tb" aria-label="Screen theme" hidden></select>
    <button class="tb" id="zoomOut" aria-label="Zoom out">−</button>
    <button class="tb zoom" id="zoomLabel" title="Zoom to 100%">100%</button>
    <button class="tb" id="zoomIn" aria-label="Zoom in">+</button>
    <button class="tb" id="fit">Fit</button>
    <button class="tb" id="chrome" aria-label="Toggle canvas light/dark">◐</button>
  </header>

  <div class="viewport" id="viewport">
    <div class="world" id="world"></div>
    <div class="shield" id="shield"></div>
  </div>

  <section class="focus" id="focus" aria-modal="true" role="dialog" aria-labelledby="focusTitle">
    <div class="focus-bar">
      <button class="tb" id="fPrev" aria-label="Previous screen">←</button>
      <button class="tb" id="fNext" aria-label="Next screen">→</button>
      <h2 id="focusTitle"></h2>
      <span class="frame-size" id="focusSize"></span>
      <span class="pill" id="focusStatus"></span>
      <div class="spacer" style="flex:1"></div>
      <select id="focusScale" class="tb" aria-label="Focus zoom">
        <option value="fit">Fit</option><option value="1">100%</option><option value="0.75">75%</option><option value="0.5">50%</option>
      </select>
      <a class="tb" id="focusOpen" target="_blank" rel="noopener">Open ↗</a>
      <button class="tb" id="fClose" aria-label="Close focus mode">Esc ✕</button>
    </div>
    <div class="focus-stage" id="focusStage"><div class="focus-wrap" id="focusWrap"></div></div>
    <p class="focus-note" id="focusNote"></p>
  </section>

<script>
(function () {
  "use strict";
  var C = window.CANVAS;
  var $ = function (id) { return document.getElementById(id); };
  var viewport = $("viewport"), world = $("world"), shield = $("shield");

  function store(key, val) {
    try { if (val === undefined) return JSON.parse(localStorage.getItem(key)); localStorage.setItem(key, JSON.stringify(val)); }
    catch (e) { return null; }
  }

  if (!C || !Array.isArray(C.groups)) {
    var m = document.createElement("div");
    m.className = "empty";
    m.innerHTML = "<div><p><b>No manifest found.</b></p><p>Create <code>canvas.js</code> next to this file defining <code>window.CANVAS</code>.</p></div>";
    document.body.appendChild(m);
    return;
  }

  var key = "design-canvas:" + (C.title || location.pathname);
  var themes = Array.isArray(C.themes) && C.themes.length ? C.themes : ["light"];
  var prefs = store(key + ":prefs") || {};
  var state = { x: 0, y: 0, s: 1, group: prefs.group || "all", theme: themes.indexOf(prefs.theme) >= 0 ? prefs.theme : themes[0] };
  document.documentElement.dataset.chrome = prefs.chrome || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.title = (C.title || "Design") + " — Canvas";
  $("title").textContent = C.title || "Design Canvas";

  /* ---------- controls ---------- */
  var gSel = $("group");
  gSel.appendChild(new Option("All groups", "all"));
  C.groups.forEach(function (g) { gSel.appendChild(new Option(g.title || g.id, g.id)); });
  if (state.group !== "all" && !C.groups.some(function (g) { return g.id === state.group; })) state.group = "all";
  gSel.value = state.group;

  var tSel = $("theme");
  if (themes.length > 1) {
    tSel.hidden = false;
    themes.forEach(function (t) { tSel.appendChild(new Option("Theme: " + t, t)); });
    tSel.value = state.theme;
  }

  function savePrefs() {
    store(key + ":prefs", { group: state.group, theme: state.theme, chrome: document.documentElement.dataset.chrome });
  }

  function src(file) {
    return file + (themes.length > 1 ? (file.indexOf("?") >= 0 ? "&" : "?") + "theme=" + encodeURIComponent(state.theme) : "");
  }

  function visibleScreens() {
    var out = [];
    C.groups.forEach(function (g) {
      if (state.group !== "all" && g.id !== state.group) return;
      (g.screens || []).forEach(function (s) { out.push(s); });
    });
    return out;
  }

  /* ---------- render ---------- */
  function render() {
    world.textContent = "";
    var counts = { draft: 0, review: 0, changes: 0, approved: 0 };
    C.groups.forEach(function (g) {
      (g.screens || []).forEach(function (s) { var st = s.status || "draft"; if (st in counts) counts[st]++; });
      if (state.group !== "all" && g.id !== state.group) return;
      var sec = document.createElement("section");
      var h = document.createElement("h2");
      h.className = "group-title"; h.textContent = g.title || g.id;
      var row = document.createElement("div"); row.className = "group-row";
      (g.screens || []).forEach(function (s) { row.appendChild(frame(s)); });
      sec.appendChild(h); sec.appendChild(row); world.appendChild(sec);
    });
    var c = $("counts"); c.textContent = "";
    [["approved", "approved"], ["review", "in review"], ["changes", "changes"], ["draft", "draft"]].forEach(function (p) {
      var span = document.createElement("span");
      span.innerHTML = '<i class="dot" style="background:var(--s-' + p[0] + ')"></i><b>' + counts[p[0]] + "</b> " + p[1];
      c.appendChild(span);
    });
  }

  function frame(s) {
    var w = +s.w || 390, h = +s.h || 844, status = s.status || "draft";
    var fig = document.createElement("figure"); fig.className = "frame"; fig.style.width = w + "px";
    var head = document.createElement("div"); head.className = "frame-head";
    var t = document.createElement("button"); t.className = "frame-title"; t.type = "button"; t.textContent = s.title || s.file;
    t.title = "Open in focus mode"; t.addEventListener("click", function () { openFocus(s); });
    var size = document.createElement("span"); size.className = "frame-size"; size.textContent = w + " × " + h;
    var pill = document.createElement("span"); pill.className = "pill " + status; pill.textContent = status;
    var open = document.createElement("a"); open.className = "frame-open"; open.href = src(s.file); open.target = "_blank"; open.rel = "noopener"; open.textContent = "Open ↗";
    head.append(t, size, pill, open);
    var body = document.createElement("div"); body.className = "frame-body";
    body.style.width = w + "px"; body.style.height = h + "px"; body.style.borderRadius = (w < 600 ? 36 : 12) + "px";
    var ifr = document.createElement("iframe"); ifr.src = src(s.file); ifr.title = s.title || s.file; ifr.loading = "lazy";
    body.appendChild(ifr);
    fig.append(head, body);
    if (s.note) { var n = document.createElement("figcaption"); n.className = "frame-note"; n.textContent = s.note; fig.appendChild(n); }
    return fig;
  }

  /* ---------- view transform ---------- */
  function apply() {
    world.style.transform = "translate(" + state.x + "px," + state.y + "px) scale(" + state.s + ")";
    var d = 24 * state.s;
    viewport.style.backgroundSize = d + "px " + d + "px";
    viewport.style.backgroundPosition = state.x + "px " + state.y + "px";
    $("zoomLabel").textContent = Math.round(state.s * 100) + "%";
    store(key + ":view:" + state.group, { x: state.x, y: state.y, s: state.s });
  }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function zoomAt(ns, cx, cy) {
    ns = clamp(ns, 0.03, 3);
    state.x = cx - (cx - state.x) * (ns / state.s);
    state.y = cy - (cy - state.y) * (ns / state.s);
    state.s = ns; apply();
  }
  function zoomCenter(f) { var r = viewport.getBoundingClientRect(); zoomAt(state.s * f, r.width / 2, r.height / 2); }
  function fit() {
    var r = viewport.getBoundingClientRect(), W = world.offsetWidth, H = world.offsetHeight;
    if (!W || !H) return;
    var s = clamp(Math.min(r.width / W, r.height / H) * 0.98, 0.03, 1);
    state.s = s; state.x = (r.width - W * s) / 2; state.y = Math.max(0, (r.height - H * s) / 2); apply();
  }
  function restoreView() {
    var v = store(key + ":view:" + state.group);
    if (v && isFinite(v.s)) { state.x = v.x; state.y = v.y; state.s = v.s; apply(); } else fit();
  }

  $("zoomIn").onclick = function () { zoomCenter(1.25); };
  $("zoomOut").onclick = function () { zoomCenter(0.8); };
  $("zoomLabel").onclick = function () { var r = viewport.getBoundingClientRect(); zoomAt(1, r.width / 2, r.height / 2); };
  $("fit").onclick = fit;
  $("chrome").onclick = function () {
    var d = document.documentElement; d.dataset.chrome = d.dataset.chrome === "dark" ? "light" : "dark"; savePrefs();
  };
  gSel.onchange = function () { state.group = gSel.value; savePrefs(); render(); restoreView(); };
  tSel.onchange = function () { state.theme = tSel.value; savePrefs(); render(); if (focusIdx >= 0) showFocus(); };

  viewport.addEventListener("wheel", function (e) {
    e.preventDefault();
    var r = viewport.getBoundingClientRect();
    if (e.ctrlKey || e.metaKey) zoomAt(state.s * Math.exp(-e.deltaY * 0.0015), e.clientX - r.left, e.clientY - r.top);
    else { state.x -= e.shiftKey ? e.deltaY : e.deltaX; state.y -= e.shiftKey ? 0 : e.deltaY; apply(); }
  }, { passive: false });

  var drag = null;
  function startDrag(e) {
    if (e.button !== 0) return;
    if (e.currentTarget === viewport && e.target.closest(".frame-head, .frame-body, .frame-note")) return;
    drag = { x: e.clientX, y: e.clientY, ox: state.x, oy: state.y, el: e.currentTarget };
    e.currentTarget.setPointerCapture(e.pointerId); viewport.classList.add("panning");
  }
  function moveDrag(e) { if (!drag) return; state.x = drag.ox + e.clientX - drag.x; state.y = drag.oy + e.clientY - drag.y; apply(); }
  function endDrag() { drag = null; viewport.classList.remove("panning"); }
  [viewport, shield].forEach(function (el) {
    el.addEventListener("pointerdown", startDrag);
    el.addEventListener("pointermove", moveDrag);
    el.addEventListener("pointerup", endDrag);
    el.addEventListener("pointercancel", endDrag);
  });

  /* ---------- focus mode ---------- */
  var focusIdx = -1, focusList = [];
  function openFocus(s) { focusList = visibleScreens(); focusIdx = focusList.indexOf(s); $("focus").classList.add("on"); showFocus(); $("fClose").focus(); }
  function closeFocus() { $("focus").classList.remove("on"); $("focusWrap").textContent = ""; focusIdx = -1; }
  function showFocus() {
    var s = focusList[focusIdx]; if (!s) return;
    var w = +s.w || 390, h = +s.h || 844;
    $("focusTitle").textContent = s.title || s.file;
    $("focusSize").textContent = w + " × " + h + "  (" + (focusIdx + 1) + "/" + focusList.length + ")";
    var p = $("focusStatus"); p.className = "pill " + (s.status || "draft"); p.textContent = s.status || "draft";
    $("focusOpen").href = src(s.file);
    $("focusNote").textContent = s.note || "";
    var wrap = $("focusWrap"); wrap.textContent = "";
    var body = document.createElement("div"); body.className = "frame-body";
    body.style.width = w + "px"; body.style.height = h + "px"; body.style.borderRadius = (w < 600 ? 36 : 12) + "px";
    var ifr = document.createElement("iframe"); ifr.src = src(s.file); ifr.title = s.title || s.file;
    body.appendChild(ifr); wrap.appendChild(body);
    scaleFocus();
  }
  function scaleFocus() {
    var s = focusList[focusIdx]; if (!s) return;
    var w = +s.w || 390, h = +s.h || 844, stage = $("focusStage"), wrap = $("focusWrap"), v = $("focusScale").value;
    var k = v === "fit" ? Math.min(1, (stage.clientWidth - 48) / w, (stage.clientHeight - 48) / h) : +v;
    wrap.style.transform = "scale(" + k + ")"; wrap.style.width = w * k + "px"; wrap.style.height = h * k + "px";
  }
  function step(d) { if (focusIdx < 0) return; focusIdx = (focusIdx + d + focusList.length) % focusList.length; showFocus(); }
  $("fPrev").onclick = function () { step(-1); };
  $("fNext").onclick = function () { step(1); };
  $("fClose").onclick = closeFocus;
  $("focusScale").onchange = scaleFocus;
  window.addEventListener("resize", function () { if (focusIdx >= 0) scaleFocus(); });

  /* ---------- keyboard ---------- */
  document.addEventListener("keydown", function (e) {
    if (e.target.tagName === "SELECT") return;
    if (focusIdx >= 0) {
      if (e.key === "Escape") closeFocus();
      else if (e.key === "ArrowRight") step(1);
      else if (e.key === "ArrowLeft") step(-1);
      return;
    }
    if (e.code === "Space" && !e.repeat) { shield.classList.add("on"); e.preventDefault(); }
    else if (e.key === "f" || e.key === "F") fit();
    else if (e.key === "0") $("zoomLabel").click();
    else if (e.key === "+" || e.key === "=") zoomCenter(1.25);
    else if (e.key === "-") zoomCenter(0.8);
  });
  document.addEventListener("keyup", function (e) { if (e.code === "Space") { shield.classList.remove("on"); endDrag(); } });
  window.addEventListener("blur", function () { shield.classList.remove("on"); endDrag(); });

  render();
  requestAnimationFrame(restoreView);
})();
</script>
</body>
</html>
