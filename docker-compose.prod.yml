services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: shopmate_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shopmate_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shopmate_password}
      POSTGRES_DB: ${POSTGRES_DB:-shopmate_db}
    ports:
      - "5432:5432"
    volumes:
      - shopmate_postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shopmate_user} -d ${POSTGRES_DB:-shopmate_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: shopmate_redis_prod
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - shopmate_redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shopmate_backend_prod
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-shopmate_user}:${POSTGRES_PASSWORD:-shopmate_password}@postgres:5432/${POSTGRES_DB:-shopmate_db}?schema=public
      REDIS_URL: redis://redis:6379
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY}
    container_name: shopmate_frontend_prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  shopmate_postgres_prod_data:
    driver: local
  shopmate_redis_prod_data:
    driver: local
